name: controldeck
description: A unified personal app hub built with Flutter.
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^11.0.0
  shared_preferences: ^2.3.3
  supabase_flutter: ^2.8.4
  url_launcher: ^6.3.2
  webview_flutter: ^4.10.0
  web: ^1.1.1
  flutter_secure_storage: ^9.2.4
  excel: ^4.0.6
  pdf: ^3.11.3
  printing: ^5.14.2
  share_plus: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
